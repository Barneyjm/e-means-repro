[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emeans-sklearn"
version = "0.1.0"
description = "e-means clustering (arXiv 2611.09501) as a scikit-learn estimator; independent re-implementation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "scikit-learn>=1.6"]

[project.optional-dependencies]
experiments = ["torch", "faiss-cpu"]
test = ["pytest"]
site = ["markdown"]

[tool.setuptools]
py-modules = ["emeans_sklearn", "online_gmm_sklearn"]
